<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCS Direct</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main><section id="auth" class="auth"><div class="logo">●</div><p class="eyebrow">Ford Atelier</p><h1>CCS Direct</h1><p>Échangez simplement avec le centre de communication et de support.</p><form id="auth-form"><label>Je suis<select id="role"><option value="technicien">Technicien</option><option value="ccs">CCS</option></select></label><label>Prénom<input id="name" required placeholder="Ex. Anthony" autocomplete="given-name"></label><p id="error"></p><button>Accéder au chat</button></form></section><section id="chat" hidden><header><div><p class="eyebrow">Canal atelier</p><h1>CCS Direct</h1></div><div id="profile"></div></header><div id="messages" class="messages"></div><form id="message-form" class="composer"><textarea id="message" placeholder="Écrivez votre message…" rows="2" required></textarea><button>Envoyer</button></form></section></main><script src="app.js"></script></body></html>
